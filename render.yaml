services:
  - type: web
    name: cloudpilot-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: CLOUDPILOT_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      - key: GLOBAL_SIM_PER_MIN
        value: "20"
      - key: SIM_MAX_STEPS
        value: "1000"
      - key: SIM_MAX_SERVICES
        value: "20"
      - key: SIM_TIMEOUT_SECONDS
        value: "42"
      - key: SIM_MAX_CONCURRENT
        value: "1"
      - key: SIM_RF_JOBS
        value: "1"
      - key: SIM_NATIVE_THREADS
        value: "1"
      - key: ENABLE_PRODUCTION_EXTENDED_SIMULATION
        value: "false"
      - key: SIM_EXTENDED_MAX_SERVICES
        value: "4"
      - key: SIM_EXTENDED_MAX_STEPS
        value: "600"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
