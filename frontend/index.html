<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/cloudpilot.svg" />

      try {
        if (localStorage.getItem("cloudpilot-theme") === "light")

    <meta
      name="description"

    />
